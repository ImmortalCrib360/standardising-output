<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root {
    --page: #f4f3ef;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }

  header { margin-bottom: 24px; }
  .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { margin: 6px 0 0; color: var(--ink-2); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
  pre.call {
    margin: 0 0 18px;
    padding: 10px 12px;
    background: var(--page);
    border-radius: 8px;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .table-wrap { max-height: 520px; overflow: auto; border: 1px solid var(--grid); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 12px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, tbody th { text-align: left; }
  thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 12px; }
  tbody th { font-weight: 500; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: none; }
  table.kv td { white-space: normal; text-align: left; }
  table.kv td:first-child { color: var(--ink-2); width: 45%; }

  figure { margin: 0 0 20px; }
  figure:last-child { margin-bottom: 0; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { color: var(--ink-2); font-size: 13px; margin-top: 4px; }

  ul.notes { margin: 0; padding-left: 18px; color: var(--ink-2); }
  ul.notes li + li { margin-top: 4px; }

  details.model { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; }
  details.model > summary { cursor: pointer; padding: 14px 20px; font-weight: 600; }
  details.model > summary span { color: var(--ink-2); font-weight: 400; margin-left: 8px; }
  details.model[open] > summary { border-bottom: 1px solid var(--grid); }
  details.model > .inner { padding: 16px; }
  details.model .card { border-color: var(--grid); }

  footer { margin-top: 32px; color: var(--muted); font-size: 12px; }

  @media print {
    body { background: white; }
    main { padding: 0; }
    .card, .tile, details.model { break-inside: avoid; }
    .table-wrap { max-height: none; overflow: visible; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">$eyebrow</p>
    <h1>$title</h1>
    <p class="subtitle">$subtitle</p>
  </header>
$body
  <footer>Generated $generated by toolkit.py</footer>
</main>
</body>
</html>
